name: C++ checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==18.1.8
      - run: >-
          clang-format --dry-run --Werror
          include/adapters/coinbase/*.hpp
          src/adapters/coinbase/*.cpp
          tests/unit/coinbase_l2_parser_test.cpp
