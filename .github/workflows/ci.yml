name: C++ checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libssl-dev
      - if: runner.os == 'macOS'
        run: brew install boost openssl@3
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==18.1.8
      - run: >-
          clang-format --dry-run --Werror
          include/adapters/coinbase/*.hpp
          src/adapters/coinbase/*.cpp
          tests/unit/coinbase_l2_parser_test.cpp
          tests/unit/coinbase_message_pipeline_test.cpp
          tests/unit/coinbase_websocket_client_test.cpp
          include/recording/raw_recording_queue.hpp
          include/pipeline/*.hpp
          src/pipeline/*.cpp
          include/benchmarks/*.hpp
          benchmarks/*.cpp
          tests/unit/ingestion_runtime_test.cpp
          tests/unit/coinbase_recovery_test.cpp
